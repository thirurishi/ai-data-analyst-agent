# Full stack: API + web app, and PostgreSQL with pgvector for SQL analysis and a durable RAG index.
# Usage: cp .env.example .env  (add your keys)  then  docker compose up --build
# Open http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: analyst
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analyst"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: analyst
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      EMBEDDING_VECTOR_STORE: ${EMBEDDING_VECTOR_STORE:-postgres}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/backend/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
